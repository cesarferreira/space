[package]
name = "space-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Explain disk usage in human terms"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/space"
readme = "README.md"
keywords = ["disk", "storage", "df", "cli", "filesystem"]
categories = ["command-line-utilities", "filesystem"]
exclude = [
    "docs/",
    ".github/",
]

[lib]
name = "space"
path = "src/lib.rs"

[[bin]]
name = "space"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
